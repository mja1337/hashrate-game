    if(points.length<2)points=[points[0]??1,points[0]??1];
    const normalise=(arr)=>{const base=Math.max(1e-12,arr[0]??1);return arr.map(x=>x/base*100)};
    const mainRaw=points.map(x=>Math.max(log?1e-9:0,x));

    const makePath=(arr)=>arr.map((v,i)=>{const vv=log?Math.log(v):v;return `${i?"L":"M"}${(p+i*(w-2*p)/denom).toFixed(1)},${(h-p-(vv-min)/range*(h-2*p)).toFixed(1)}`}).join(" ");

e-height:1.6">Lightning is not proof-of-stake. Here it is modelled as committing BTC to payment-channel liquidity so your node can route payments and earn routing fees. The BTC remains yours, but it is not liquid for ordinary spending or exchange sales until withdrawn.</p><div class="metric-row"><div class="metric"><div class="label">Locked liquidity</div><strong>${fmtBtc(lightningLocked())}</strong><small>BTC committed to routing</small></div><div class="metric"><div class="label">Routing fee rate</div><strong>${(lightningRate()*100).toFixed(4)}% / day</strong><small>Scaled by network activity</small></div><div class="metric"><div class="label">Fees earned</div><strong>${fmtBtc(state.lightning.earned)}</strong><small>Lifetime simulated routing income</small></div><div class="metric"><div class="label">Today's fees</div><strong>${fmtBtc(lightningDailyFee())}</strong><small>Added once per simulation day</small></div></div><div class="actions" style="margin-top:14px"><button class="action small primary" data-action="lightning" data-value=".25" ${!lightningAvailable()||state.wallets.hot<=0?"disabled":""}>Lock 25% hot BTC</button><button class="action small" data-action="lightning" data-value=".5" ${!lightningAvailable()||state.wallets.hot<=0?"disabled":""}>Lock 50%</button><button class="action small" data-action="lightning" data-value="1" ${!lightningAvailable()||state.wallets.hot<=0?"disabled":""}>Lock all</button><button class="action small" data-action="lightning-withdraw" ${lightningLocked()<=0?"disabled":""}>Withdraw all</button></div><p class="modal-note" style="margin-top:10px">Requires a full node. Withdrawal uses a small simulated channel-close cost. Routing revenue is deliberately modest and depends on transaction activity rather than being guaranteed yield.</p></div></section></div>`

  function method(){return `<article class="card card-pad method"><div class="hero-kicker">Method & game economics</div><h2>How the simulation turns Bitcoin mechanics into an operating business.</h2><p>This tab is the game's technical manual. Every number shown elsewhere is either a recorded historical anchor, a derived calculation, or a modelled gameplay assumption. Use it to understand why a decision changes cash flow, mining yield, risk or liquidity.</p><h3>1. Network share & mining probability</h3><p>Your effective share is <code>your hash ÷ (historical network hash + your hash)</code>. The network is not static: the game's historical hash path rises over time. That means buying more hardware can increase your share while still producing less BTC later if the global network grows faster.</p><p>Expected blocks/day = <code>144 × share × uptime</code>. Uptime is the region reliability, capped at 100%, plus the monitoring skill bonus. Expected BTC/day multiplies those blocks by <code>subsidy + transaction fees</code>.</p><h3>2. Solo vs pool</h3><table><tr><th>Mechanic</th><th>Solo</th><th>Pool</th></tr><tr><td>Underlying odds</td><td>Your share of block-finding probability</td><td>Same expected share</td></tr><tr><td>Variance</td><td>High: whole blocks arrive randomly</td><td>Low: rewards are smoothed</td></tr><tr><td>Fee</td><td>None</td><td>${(poolFee()*100).toFixed(2)}% currently</td></tr><tr><td>Reward timing</td><td>Can be very long between wins</td><td>Small, regular simulated payouts</td></tr></table><p>Solo uses a seeded Poisson process, so a small miner can have long dry spells followed by a block. Pool mode pays the same expected economics less the selected pool fee, with a small payout-variance factor. Each historical pool has its own approximate market share and base fee; selecting a pool changes the fee economics and lets you watch concentration shift over time. Pool operations can reduce that fee.</p><h3>3. Hardware economics</h3><p>Each machine contributes hash rate, watts and floor space. Firmware adds 8% hash; undervolting removes 10% power. Procurement reduces purchase cost by 10%. A purchase is accepted only if the resulting fleet fits both electrical capacity and floor space.</p><p>Hardware has no automatic depreciation charge, but selling returns 30% of listed purchase cost. This is intentionally simple: obsolescence is represented by later generations offering dramatically better hash-per-watt rather than a daily resale mark.</p><h3>4. Power, rent & liquidity</h3><p>Daily operating cost is <code>(active watts ÷ 1000) × 24 × electricity rate + monthly rent ÷ 30.4375</code>. Electricity can be altered by region, historical energy shocks and smart metering. Heat reuse reduces the resulting energy bill by 6%. Bills accumulate and are settled monthly. If cash cannot cover a bill, debt is created and the grid disconnects the operation.</p><p>Facility fit-outs now require both the construction cost and a two-month operating reserve to remain liquid. This prevents a profitable-looking expansion from immediately leaving the business unable to pay its next bills.</p><h3>5. Market & cash</h3><p>Before 17 July 2010 there is no quoted BTC/USD market in the game. After that point, buying spends a fraction of available fiat and applies a venue-specific fee; selling converts BTC at the historical price with the same venue fee. “Available fiat” is the genuinely liquid cash balance—not BTC, ETF exposure or Lightning liquidity.</p><p>Exchanges are custodial claims. Mt. Gox and the Frontier venue can suffer historical failure events that freeze or destroy part of those balances. The regulated exchange has lower modelled counterparty risk; the ETF is price exposure, not spendable bitcoin.</p><h3>6. Custody & nodes</h3><p>Hot and cold balances count as bitcoin controlled by your keys. Exchange balances are claims on someone else's custody. A full node independently verifies the chain but does not itself create BTC or custody funds. Node operation consumes continuous power.</p><h3>7. Lightning routing liquidity</h3><p>Lightning becomes available from 2018 in this simulation and requires a full node. This is modelled as <strong>routing liquidity</strong>, not proof-of-stake: you lock BTC into payment-channel liquidity so your node can help route payments. The locked BTC remains an asset, but it is unavailable for ordinary spending or exchange sales until withdrawn.</p><p>Routing fees are deliberately modest. Daily fees are approximately <code>locked BTC × base routing rate × network transaction-activity factor</code>. Monitoring improves routing performance. Fees are paid into your hot wallet each simulation day, while the principal remains locked. Withdrawal has a small simulated channel-close cost.</p><h3>8. Facilities & regions</h3><p>Facilities set electrical capacity, floor capacity, rent and fit-out cost. Regions set electricity price, reliability and relocation cost. Some regions can become unavailable because of historical policy or network events. Relocation also costs 5% of fleet value unless the relocation skill reduces the cost.</p><h3>9. Skills</h3><p>Skill points come from major historical events and mining milestones. Skills modify the underlying equations rather than simply adding score: energy skills change power cost, compute skills change hash or hardware cost, operations skills change pool fees/uptime/relocation, and treasury skills change custody-transfer economics.</p><h3>10. Historical events</h3><p>Event cards provide chronology and a modelled 30-day BTC price-path comparison. That percentage is calculated from the game's historical price anchors; it is context, not a causal claim. Events can also change gameplay directly, such as exchange failures or regional shutdowns, and major events can award skill points.</p><h3>11. What is historical vs modelled?</h3><table><tr><th>Class</th><th>Meaning</th><th>Examples</th></tr><tr><td>${sourceTag("recorded")}</td><td>Historical anchor</td><td>Dates, price points, halvings, known events</td></tr><tr><td>${sourceTag("derived")}</td><td>Calculated from anchors and your state</td><td>Network share, expected yield, bills, net worth</td></tr><tr><td>${sourceTag("modelled")}</td><td>Gameplay simplification</td><td>Hardware prices, venue fills, pool smoothing, Lightning routing fees, reliability</td></tr></table><p class="modal-note">The purpose is to expose the economic relationships, not to predict Bitcoin prices or promise investment returns.</p></article>`}
  function techV2(){const branches=["Compute","Energy","Operations","Treasury"];return `<div class="grid"><section class="card span-12"><div class="hero"><div><div class="hero-kicker">Operator specialisation</div><h1>Choose a path, then build on it.</h1><p>Each branch is a dependency chain. Early choices unlock deeper operating capabilities, so points spent now determine which responses you can make later.</p></div><div class="hero-stat"><strong>${state.points}</strong><span>unspent skill points</span></div></div></section><section class="span-12 tech-trees">${branches.map(branch=>{const skills=SKILLS.filter(s=>s.branch===branch),unlocked=skills.filter(s=>hasSkill(s.id)).length;return `<article class="tech-tree"><div class="tech-tree-head"><span>${branch} tree</span><span>${unlocked} / ${skills.length} unlocked</span></div><div class="tree-nodes">${skills.map((s,i)=>{const done=hasSkill(s.id),ready=!s.req||hasSkill(s.req),enough=state.points>=s.cost,status=done?"Unlocked":!ready?`Requires ${SKILLS.find(x=>x.id===s.req)?.name}`:!enough?`Need ${s.cost} point${s.cost===1?"":"s"}`:"Ready to unlock";return `<div class="tree-node ${done?"unlocked":ready?"ready":""}"><div class="skill-branch">Tier ${i+1}</div><h3>${s.name}</h3><p>${s.desc}</p><div class="tree-cost">${s.cost} point${s.cost===1?"":"s"}${s.req?` · follows ${SKILLS.find(x=>x.id===s.req)?.name}`:" · foundation"}</div><div class="tree-state">${status}</div><button class="action small ${done?"":"primary"}" data-action="skill" data-id="${s.id}" ${done||!ready||!enough?"disabled":""}>${done?"Unlocked":"Unlock"}</button></div>`}).join("")}</div></article>`}).join("")}</section></div>`}
  function methodV2(){return `<article class="card card-pad method"><div class="hero-kicker">Method & game economics</div><h2>The complete operator manual.</h2><p>This is a historical Bitcoin operating simulation. Recorded dates and broad market/network anchors drive the world; cashflow, hardware pricing, incident probabilities and several outcomes are deliberately modelled for play. Nothing here predicts returns or represents investment advice.</p><h3>1. Time, story and simulation speed</h3><p>One simulation tick is one day. The history feed progresses through dated chapters; major chapters can pause the clock when Story pause is enabled. Entering Mine pauses the timeline for purchasing, then restores your selected speed when you leave. After the historical cutoff, Sandbox continuation keeps the operation running but introduces no new history, hardware or news.</p><h3>2. Mining probability and payout</h3><p>Your effective share is <code>your active hash / (historical network hash + your active hash)</code>. Expected blocks/day is <code>144 x share x uptime</code>; payout then uses the applicable subsidy plus the modelled fee component. Solo mining uses seeded random block finds, so rewards are lumpy. Pool mining smooths the same underlying expectation, less the pool fee.</p><h3>3. Hardware, capacity and resale</h3><p>Every machine consumes watts and floor units while providing hash rate. A purchase must fit the facility's floor and electrical limits. Newer machines generally improve hash-per-watt; resale value diminishes with hardware age. Firmware tuning, undervolting, procurement and ASIC tuning modify the relevant purchase, power or hash calculation. Hydro ASICs also need liquid-cooling technology and a suitable facility; otherwise they remain visible as offline assets.</p><h3>4. Maintenance and spare parts</h3><p>Active equipment loses condition over time. Below 65% condition, that machine type goes offline until serviced. Service consumes parts and labour. Parts must be ordered before use; the COVID period has higher prices and longer lead times. Offline assets do not mine, but their installed fleet and facility requirements remain visible.</p><h3>5. Firmware security</h3><p>ASIC and hydro ASIC fleets require a signed firmware review after 26 April 2017 and then every 18 simulation months. An overdue review creates a monthly compromise risk. A compromise diverts 35% of mining rewards to an attacker until the fleet is reflashed in Facilities. Reflashing costs a per-machine rollout fee and immediately clears an active compromise.</p><h3>6. Energy, rent and liquidity</h3><p>Daily operating cost is <code>(active watts / 1000) x 24 x electricity rate + monthly fixed costs / 30.4375</code>. Region, contract choice, energy shocks and energy skills change the rate. Rent, staff, insurance and node power are included in monthly cashflow. Bills accrue during the month and settle at the month boundary. Insufficient cash creates debt and disconnects the grid. The settlement forecast shows whether cash will cover the next bill.</p><h3>7. Facilities, regions and migration</h3><p>Facilities determine capacity, space, rent and fit-out cost. Regions determine power price, baseline reliability, relocation cost, policy exposure and connectivity risk. Moving up the facility ladder can trigger modelled contract, transit or seizure incidents; insurance protects eligible move incidents. Historical regional shutdowns can force a relocation. Fit-outs also require a two-month operating reserve after construction cost.</p><h3>8. Internet and bandwidth outages</h3><p>Each month, an operating facility faces a location-weighted bandwidth-outage chance. An outage pauses mining and node/Lightning operation for several simulation days, while electricity, rent and other overhead continue. Monitoring reduces the regional outage chance by 35%. The Operational risk desk shows the current connection state and expected restoration date.</p><h3>9. Market, exchanges and withdrawal freezes</h3><p>BTC/USD trading starts only after the first market date. Buying uses liquid fiat and a venue fee; selling converts an eligible BTC balance back to fiat. Venue balances are custodial claims, not self-custodied bitcoin. In addition to historical collapse events, venues carrying a balance can model a temporary withdrawal freeze. A freeze blocks sales and transfers from that venue until it expires, but does not itself erase the balance. Known failure events may still create losses or frozen claims.</p><h3>10. Custody, nodes and Lightning</h3><p>Hot and cold wallet balances are keys-controlled bitcoin. Exchange, ETF and frozen-claim balances are not. A full node validates independently, consumes continuous power and requires enough disk for the modelled chain size. If archival storage falls short, it goes offline; pruning preserves limited validation but removes Lightning routing and the lower full-node transfer fee. Lightning requires an online archival node and locks BTC as routing liquidity; fees accrue slowly to the hot wallet, while the principal remains locked until withdrawal.</p><h3>11. Knowledge, skills and operating strategy</h3><p>Bitcointalk, books and podcasts each occupy the same learning slot and take simulation time. Some finish with a knowledge check; reaching knowledge thresholds awards skill points. Major story events and operational milestones also award points. Tech choices change calculations rather than merely adding score. Contracts trade cheaper spot power for certainty; staff add recurring cost in exchange for targeted operating benefits. Strategy securities are simplified BTC-linked capital-structure exposure, and their displayed yields are modelled fiat accruals.</p><h3>12. Optional risk and civil-society actions</h3><p>Historical-era speculative bets risk hot-wallet BTC with deterministic, loss-biased outcomes. Donation opportunities send a chosen portion of hot-wallet BTC and are permanent. Neither action is required to complete the game.</p><h3>13. Historical events and sources</h3><p>The story contains protocol, mining, custody, policy, adoption and market-structure milestones. Event cards use a modelled 30-day price comparison only as context, not proof of causation. A small set of dated events has direct effects, such as venue failures and regional shutdowns. Context-only chapters do not award points or interrupt play.</p><h3>14. Data classes</h3><table><tr><th>Class</th><th>Used for</th><th>Examples</th></tr><tr><td>${sourceTag("recorded")}</td><td>Historical anchors</td><td>Protocol dates, halvings, major events, broad market and network paths</td></tr><tr><td>${sourceTag("derived")}</td><td>Calculated from your state</td><td>Hash share, expected yield, energy bills, cash runway, net worth</td></tr><tr><td>${sourceTag("modelled")}</td><td>Game mechanics</td><td>Hardware prices and resale, pool smoothing, incidents, outages, venue freezes and Lightning fees</td></tr></table><p class="modal-note">The aim is to expose the trade-offs of running a Bitcoin operation through changing eras: security, energy, policy, custody, liquidity, maintenance and adaptation.</p></article>`}
  function methodV3(){return `<article class="card card-pad method"><div class="hero-kicker">Method & game economics</div><h2>Operator manual: what the simulation actually does.</h2><p>Historical dates, major events, broad price and network-hash anchors are recorded inputs. Hardware pricing, incidents, uptime, fees and outcomes are gameplay models designed to expose operating trade-offs—not forecasts.</p><h3>1. Clock, story and speed</h3><p>One simulation day advances per tick. Story pause stops at major chapters; entering Mine pauses time while you buy hardware. In sandbox mode after the data cutoff, the operation continues but no new history, hardware or news is introduced.</p><h3>2. Mining and payouts</h3><p>Your share is <code>active fleet hash / (historical network hash + active fleet hash)</code>. Expected blocks/day are <code>144 × share × uptime</code>, paid at the current subsidy plus modelled fees. Solo rewards are seeded random block finds; pools smooth the same expectation after pool fees. Offline, maintenance-blocked or compromised hardware does not earn normally.</p><h3>3. Fleet and maintenance</h3><p>Each machine has hash rate, watts and floor-space use. It must fit both facility power and floor capacity. Hardware condition falls while active; below 65%, that type goes offline until serviced. Service consumes parts and labour. Resale is modelled to decay as equipment ages. Hydro machines need the Liquid-cooling Plant tech and a warehouse-scale facility.</p><h3>4. Firmware, outages and migration</h3><p>ASIC firmware reviews expire every 18 simulation months after the firmware-risk era begins. An unpatched fleet can have 35% of rewards diverted until reflashed. Connectivity incidents are region-weighted and pause mining/node operation while overhead continues. Moving facilities or regions has modelled transit, contract and seizure risk; insurance covers eligible migration incidents.</p><h3>5. Energy and bills</h3><p>Electricity is <code>regional base tariff × contract multiplier × shock adjustment × energy-tech efficiency × temporary repricing</code>. Fixed PPAs ignore historical energy shocks; other contracts pass them through. Daily energy cost is <code>active kW × 24 × all-in rate</code>. Rent, staff, insurance and node power are separate overhead. Bills settle monthly; an unpaid bill creates grid arrears and disconnects the fleet.</p><h3>6. Finance</h3><p>Project finance adds cash now and charges 1.2% monthly interest, or 0.9% with a Treasury Manager. Interest is settled with the monthly bill. The Finance tab compares total exposure with modelled fleet resale collateral. Grid arrears carry no modelled interest, but force an immediate shutdown until paid.</p><h3>7. Market and custody</h3><p>BTC/USD trading becomes available after the first market date. Buying uses liquid fiat; selling converts a venue balance to fiat after fees. Hot and cold wallets are keys-controlled BTC. Exchange balances, ETFs and frozen claims are not. Venues can freeze withdrawals temporarily; historical venue failures can destroy or freeze part of a balance.</p><h3>8. Full nodes: exact game logic</h3><p>A node does <strong>not</strong> mine, create BTC, protect exchange balances or increase your hash rate. It represents independently validating the chain and operating infrastructure for self-custody and Lightning. A Full node costs $260; a Hardened node costs $1,200 and is available from 2016. They use 25 W and 80 W respectively, adding to energy costs.</p><table><tr><th>State</th><th>Requirement</th><th>Game result</th></tr><tr><td>Online archival node</td><td>Node installed, power on, no site outage, and disk capacity at least equal to the modelled chain size</td><td>Enables Lightning after 2018 and reduces standard transfer base fee from 0.00020 BTC to 0.00005 BTC.</td></tr><tr><td>Pruned node</td><td>Node installed, power on, no outage, 25 GB disk</td><td>Basic validation remains available, but Lightning and the full-node transfer-fee benefit are disabled.</td></tr><tr><td>Offline node</td><td>No power, site outage, no node, or archival disk smaller than the modelled chain</td><td>No Lightning routing and no lower transfer fee.</td></tr></table><p>Chain storage grows through the timeline. Upgrade disk before archival storage falls short; otherwise choose pruning as a temporary compromise. Lightning locks hot-wallet BTC as routing liquidity, then earns small modelled routing fees only while an archival node is online. Monitoring adds 15% to those routing fees.</p><h3>9. Learning, skills and strategy</h3><p>One forum, book or podcast can progress at a time. Knowledge thresholds, historical milestones and mining milestones award skill points. Tech trees impose prerequisites. Skills alter real calculations: power, hash, capacity, purchase price, transfer fees, uptime, relocation and operations. Strategy securities are simplified BTC-linked exposure; modelled yields accrue in fiat where shown.</p><h3>10. Optional actions and provenance</h3><p>Speculation risks hot-wallet BTC with deterministic loss-biased outcomes. Donations are permanent hot-wallet transfers. Event cards provide historical context; their 30-day price move is illustrative, not causal. The Method tab labels outcomes as recorded, derived or modelled where that distinction matters.</p><p class="modal-note">The goal is to make the operational choices legible: infrastructure, security, energy, custody, liquidity and adaptation all compete for the same limited capital.</p></article>`}
  function enhanceMethod(){const guide=document.querySelector(".method");if(!guide||guide.querySelector(".strategy-method-guide"))return;guide.insertAdjacentHTML("beforeend",'<section class="strategy-method-guide"><h3>11. Asset map and live header</h3><p>The header is the live asset snapshot: <strong>Liquid fiat</strong> is spendable cash; <strong>Illiquid fiat</strong> is ETF plus Strategy equity value that must be sold before it can pay a bill; <strong>Self-held BTC</strong> is hot plus cold bitcoin under your keys; <strong>Custodial BTC</strong> is exchange or frozen-claim exposure; and <strong>Lightning locked</strong> is hot BTC committed to routing channels. Only self-held hot and cold BTC count toward the final score. Lightning must be withdrawn first.</p><table><tr><th>Asset</th><th>What it means</th><th>Liquidity / final score</th></tr><tr><td>Liquid fiat</td><td>Cash available for bills, miners and market orders</td><td>Spendable; not BTC score</td></tr><tr><td>Illiquid fiat</td><td>ETF and Strategy equity market value</td><td>Sell first to pay a bill; excluded from score</td></tr><tr><td>Self-held BTC</td><td>Hot and cold wallet bitcoin under your keys</td><td>Included in final score</td></tr><tr><td>Custodial BTC</td><td>Exchange and frozen-claim balances</td><td>Venue-dependent; excluded from score</td></tr><tr><td>Lightning locked BTC</td><td>Hot BTC committed to routing channels</td><td>Withdraw before spending or final score</td></tr></table><h3>12. Strategy equities: exact game logic</h3><p>Strategy securities are optional, fiat-priced capital-structure exposure to Strategy’s Bitcoin-treasury business. They are not Bitcoin, are not self-custody, and are not liquid fiat. Their game price starts from a model price and moves with Bitcoin from the security unlock date using its BTC sensitivity. This is a gameplay proxy, not a recreation of historical security prices.</p><table><tr><th>Ticker</th><th>In-game exposure</th><th>Modelled fiat income</th></tr><tr><td>MSTR</td><td>Common equity; 1.65× BTC sensitivity</td><td>None</td></tr><tr><td>STRK</td><td>Strike preferred; 0.35× BTC sensitivity</td><td>8% annual accrual</td></tr><tr><td>STRF</td><td>Strife preferred; 0.20× BTC sensitivity</td><td>10% annual accrual</td></tr><tr><td>STRD</td><td>Stride preferred; 0.25× BTC sensitivity</td><td>10% annual accrual</td></tr><tr><td>STRC</td><td>Stretch preferred; 0.08× BTC sensitivity</td><td>9% annual accrual</td></tr></table><p>Buy and sell Strategy shares in Market using liquid fiat. They appear in Finance as <strong>illiquid fiat</strong> and contribute to net worth, but cannot pay bills until sold. Every preferred position uses a simplified daily fiat accrual at the displayed annual rate; it is not a real-world dividend guarantee.</p><h3>13. Remaining game systems at a glance</h3><p><strong>Purchasing:</strong> orders reserve power and floor capacity, have lead times and can slip. <strong>Hydro:</strong> needs liquid-cooling tech and a suitable facility. <strong>Maintenance:</strong> condition below 65% takes a hardware type offline; parts and technicians restore it. <strong>Firmware:</strong> review every 18 months or face reward-diversion risk. <strong>Energy:</strong> rate combines region, contract, shocks and tech; bills settle monthly. <strong>Migration:</strong> modelled contract, transit and seizure risk; insurance protects eligible losses. <strong>Nodes:</strong> need power and adequate disk; archival mode enables Lightning and transfer savings. <strong>Learning:</strong> one item at a time earns knowledge and skill points. <strong>Speculation and donations:</strong> optional hot-wallet BTC decisions. <strong>Sandbox:</strong> continues operations and halvings without new history.</p></section>');}

  function endModal(){
    const peers=[{name:"Genesis-era sovereign",btc:1050000},{name:"Industrial pool treasury",btc:325000},{name:"Cycle veteran",btc:62000},{name:"Institutional miner",btc:12500},{name:"Disciplined operator",btc:2200},{name:"Solo survivor",btc:280},{name:"Late-cycle entrant",btc:21},{name:"Casual node runner",btc:1.4},{name:"You",btc:controlled(),you:true}].sort((a,b)=>b.btc-a.btc),rank=peers.findIndex(x=>x.you)+1;
    return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true"><div class="modal-top"></div><div class="modal-body"><div class="modal-kicker">Historical record complete · 08 August 2026</div><h2>You finished #${rank} of ${peers.length}.</h2><p class="lead">Final score: ${fmtBtc(controlled())} under keys you control.</p><div class="intro-grid"><div class="intro-fact"><b>${fmtBtc(controlled())}</b><span>Score · hot + cold self-custody</span></div><div class="intro-fact"><b>${fmtBtc(claims())}</b><span>Custodial claims · excluded</span></div><div class="intro-fact"><b>${fmtUsd(equityValue()+state.wallets.etf*priceAt(state.time))}</b><span>Equities + ETF exposure · excluded</span></div></div><p class="modal-note">Not your keys, not your coins: exchange balances, frozen claims, ETFs and strategy equities do not count toward the final score. Lightning BTC is also excluded until it is withdrawn back to self-custody.</p><div class="leaderboard">${peers.map((x,i)=>`<div class="rank ${x.you?"you":""}"><span>#${i+1}</span><span>${x.name}</span><b>${fmtBtc(x.btc)}</b></div>`).join("")}</div><p class="modal-note">Synthetic comparison strategies—not claimed identities of real on-chain wallets.</p><div class="modal-actions"><button class="action primary" data-action="close-end">Inspect final ledger</button><button class="action" data-action="export">Export run</button></div></div></section></div>`
  }
  function render(){
    const banner=state.debt>0||state.policyLock?`<div class="status-banner"><strong>${state.policyLock?"Policy shutdown":"Grid disconnected"}</strong><span>${state.policyLock||fmtUsd(state.debt)+" must be paid before mining resumes."}</span><div class="push actions">${state.debt>0?`<button class="action small primary" data-action="pay-debt" ${state.cash<state.debt?"disabled":""}>Pay ${fmtUsd(state.debt)}</button>`:""}<button class="action small" data-action="tab" data-value="${state.policyLock?"facilities":"market"}">${state.policyLock?"Relocate":"Raise cash"}</button></div></div>`:"";
    document.getElementById("app").innerHTML=`<div class="app">${renderHeader()}${banner}<div class="shell"><main class="main">${nav()}<div class="content">${content()}</div></main>${sidebar()}</div><footer class="footer"><span>Historical simulation · recorded, derived and modelled data are labelled separately · not financial advice</span><span><button data-action="story-pause">Story pause: ${state.storyPause?"on":"off"}</button> · <button data-action="export">Export save</button> · <button data-action="import">Import save</button> · <button data-action="reset">New run</button><input id="importSave" type="file" accept="application/json,.json" hidden></span></footer></div>${!state.started?introModal():""}${state.activeEvent?eventModal():""}${state.ended&&!state.endDismissed?endModal():""}${toast?`<div class="toast"><div><b>${toast.title}</b><span>${toast.message}</span></div></div>`:""}${faucet?`<div class="faucet-pop"><div class="faucet-bar"></div><div class="faucet-body"><b>Bitcoin Faucet · ${dateFmt(state.time)}</b><span>Free coins for anyone who asks — a real early-Bitcoin giveaway. Grab it before it's gone.</span><div class="modal-actions" style="margin-top:10px"><button class="action small primary" data-action="claim-faucet">Claim ${fmtBtc(faucet.amount)}</button></div></div></div>`:""}`;
  }

  document.getElementById("app").addEventListener("click",e=>{
    const b=e.target.closest("[data-action]");if(!b||b.disabled)return;const a=b.dataset.action,v=b.dataset.value,id=b.dataset.id;
    if(a==="begin"){state.started=true;state.seen=["genesis"];if(!state.startingGrant){state.points+=1;state.startingGrant=true;log("Genesis operator grant","+1 skill point")}state.speed=1;save();setTimer();render()}
    else if(a==="intro-next"){introStep=Math.min(INTRO_SLIDES.length-1,introStep+1);render()}
    else if(a==="intro-back"){introStep=Math.max(0,introStep-1);render()}
    else if(a==="claim-faucet")claimFaucet();
    else if(a==="start-learning")startLearning(id);
    else if(a==="learning-check")answerLearningCheck(v);
    else if(a==="order-parts")orderParts(id,Number(v));
    else if(a==="service-hw")serviceHardware(id);
    else if(a==="patch-firmware")patchFirmware();
    else if(a==="node-storage")upgradeNodeStorage(Number(v));
    else if(a==="node-prune")toggleNodePruning();
    else if(a==="donate-btc")donateBtc(id,Number(v));
    else if(a==="buy-strategy")buyStrategy(id,Number(v));
    else if(a==="sell-strategy")sellStrategy(id,Number(v));
    else if(a==="contract")setContract(id);
    else if(a==="hire-staff")hireStaff(id);
    else if(a==="insurance")toggleInsurance();
    else if(a==="project-loan")takeProjectLoan();
    else if(a==="repay-loan")repayProjectLoan();
    else if(a==="speed"){if(activeTab==="mine"&&state.shoppingPause){state.returnSpeed=Number(v)||state.returnSpeed;showToast("Buying mode","Your selected speed will resume when you leave Mine.")}else{state.speed=Number(v);state.returnSpeed=state.speed||state.returnSpeed;setTimer();save();render()}}
    else if(a==="tab"){if(v==="mine"&&activeTab!=="mine"&&state.started&&state.speed>0){state.returnSpeed=state.speed;state.speed=0;state.shoppingPause=true;setTimer();save()}else if(activeTab==="mine"&&v!=="mine"&&state.shoppingPause){state.shoppingPause=false;state.speed=state.returnSpeed||1;setTimer();save()}activeTab=v;render();window.scrollTo({top:0,behavior:"smooth"})}
    else if(a==="buy-hw")buyHardware(id,Number(v));else if(a==="buy-hw-btc")buyHardwareBtc(id,Number(v));else if(a==="sell-hw")sellHardware(id,Number(v));else if(a==="sell-hw-btc")sellHardwareBtc(id,Number(v));else if(a==="facility")upgradeFacility(id);else if(a==="region")moveRegion(id);else if(a==="buy-node")buyNode(Number(v));
    else if(a==="buy-btc")buyBtc(id,Number(v));else if(a==="sell-btc")sellBtc(id,Number(v));else if(a==="lightning")deployLightning(Number(v));else if(a==="lightning-withdraw")withdrawLightning();else if(a==="transfer")transfer(b.dataset.from,b.dataset.to,Number(v));else if(a==="speculate")takeSpeculation(id,Number(v));else if(a==="skill")unlockSkill(id);
    else if(a==="mode"){state.mode=v;save();render()}else if(a==="pool"){if(availablePool()&&poolData(v)){state.pool=v;state.mode="pool";save();render()}}else if(a==="toggle-power"){state.power=!state.power;log(state.power?"Mining fleet started":"Mining fleet stopped","manual");save();render()}
    else if(a==="pay-debt")payDebt();else if(a==="story"){state.activeEvent=id;state.eventResume=false;render()}
    else if(a==="close-event"){state.activeEvent=null;if(state.eventResume){state.speed=state.returnSpeed||1;state.eventResume=false;setTimer()}save();render()}
    else if(a==="continue-run"){state.ended=false;state.endDismissed=true;state.sandbox=true;state.speed=state.returnSpeed||1;log("Sandbox continuation started","historical feed complete");save();setTimer();render()}
    else if(a==="close-end"){state.endDismissed=true;save();render()}else if(a==="story-pause"){state.storyPause=!state.storyPause;save();render()}
    else if(a==="reset")resetGame();else if(a==="export")exportSave();else if(a==="import")document.getElementById("importSave").click();
  });
  document.getElementById("app").addEventListener("change",e=>{if(e.target.id==="importSave"&&e.target.files&&e.target.files[0])importSave(e.target.files[0])});
  document.getElementById("app").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches(".story-item"))e.target.click()});
  const originalApplyEvent=applyEvent;applyEvent=function(e){originalApplyEvent(e);if(e.imp===3&&state.storyPause)state.eventResume=true};
  const originalTick=tick;tick=function(silent=false){const old=state.speed;originalTick(silent);if(!silent&&old!==state.speed)setTimer()};
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState!=="visible"||!state.started||state.speed<=0||state.ended)return;const stepMs=2000/state.speed,steps=Math.min(3650,Math.floor((Date.now()-(state.lastReal||Date.now()))/stepMs));for(let i=0;i<steps&&state.speed>0&&!state.ended;i++)tick(true);state.lastReal=Date.now();save();render();setTimer()});
  if(state.ended)state.speed=0;setTimer();render();
  </script>
</body>
</html>
